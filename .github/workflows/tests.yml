name: tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true

      - name: Rust toolchain for the WASM kernel tests
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install
        run: uv sync --frozen --python ${{ matrix.python }}

      # The kernel tests build three Rust/WebAssembly modules, which is minutes of work for one
      # interpreter's worth of information. They live in the `wasm` job below.
      - name: Tests
        run: uv run pytest -q --ignore=tests/test_wasm.py

      - name: Emitted data is committed and stable
        run: |
          # Every example whose study is a sweep: a dynamics study has no payload to emit, by
          # design. The list is derived rather than typed, so a new example cannot be half-wired.
          for model in $(uv run python scripts/examples.py --with-payload); do
            uv run otkd emit "examples/$model" "examples/$model/out.js"
          done
          git add -A
          git diff --cached --exit-code

      - name: Examples validate
        run: |
          for model in $(uv run python scripts/examples.py); do
            uv run otkd check "examples/$model" --quiet
          done

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install
        run: uv sync --frozen

      - name: Kernel conformance
        run: uv run pytest tests/test_wasm.py -q

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0 # the whole branch, so every commit can be checked

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      # Conventional Commits are the version source, so a malformed one is a broken release.
      - name: Every commit parses
        run: uv run python scripts/version.py lint --since "${{ github.event.pull_request.base.sha }}"

      - name: What this merge would release
        run: |
          uv run python scripts/version.py next --since "${{ github.event.pull_request.base.sha }}" --json
